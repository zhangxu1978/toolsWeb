<!DOCTYPE html>
<html lang="zh-CN" data-theme="chinese">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Long+Cang&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
        }

        .header h1 {
            font-size: 24px;
            color: #333;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .category-tabs {
            display: flex;
        }

        .cat-tab {
            padding: 8px 14px;
            border: 1px solid #dcdfe6;
            border-left-width: 0;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .cat-tab:first-child {
            border-left-width: 1px;
            border-radius: 4px 0 0 4px;
        }

        .cat-tab:last-child {
            border-radius: 0 4px 4px 0;
        }

        .cat-tab.active {
            background: #409eff;
            color: white;
            border-color: #409eff;
        }

        .tool-cat {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 6px;
        }

        .cat-work { background: #e8f0fe; color: #2e4a62; }
        .cat-life { background: #fdf0e6; color: #c94c4c; }
        .cat-general { background: #f0f5e8; color: #6b8e23; }

        .filter-select {
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }

        .filter-select:focus {
            outline: none;
            border-color: #409eff;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #409eff;
            color: white;
        }

        .btn-primary:hover {
            background: #66b1ff;
        }

        .btn-success {
            background: #67c23a;
            color: white;
        }

        .btn-success:hover {
            background: #85ce61;
        }

        .btn-danger {
            background: #f56c6c;
            color: white;
        }

        .btn-danger:hover {
            background: #f78989;
        }

        .btn-warning {
            background: #e6a23c;
            color: white;
        }

        .btn-warning:hover {
            background: #ebb563;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 12px;
        }

        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 16px;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 16px;
        }

        .tool-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            padding: 20px;
            transition: transform 0.2s;
        }

        .tool-card:hover {
            transform: translateY(-2px);
        }

        .tool-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .tool-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .tool-type {
            display: inline-block;
            padding: 2px 8px;
            background: #ecf5ff;
            color: #409eff;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 8px;
        }

        .tool-info {
            margin-bottom: 12px;
        }

        .tool-info p {
            margin-bottom: 6px;
            font-size: 14px;
            color: #666;
        }

        .tool-info label {
            color: #999;
            font-size: 12px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-running {
            background: #f0f9ff;
            color: #409eff;
        }

        .status-stopped {
            background: #f5f7fa;
            color: #909399;
        }

        .status-healthy {
            background: #f0f9ff;
            color: #67c23a;
        }

        .status-unhealthy {
            background: #fef0f0;
            color: #f56c6c;
        }

        .tool-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 8px;
            width: 500px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 18px;
            color: #333;
        }
        .remove-btn,
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .modal-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-row .form-group {
            margin-bottom: 16px;
        }

        .form-row.checkbox-row .form-group {
            margin-bottom: 8px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #409eff;
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state p {
            margin-bottom: 16px;
            font-size: 16px;
        }

        .health-info {
            margin-top: 8px;
            font-size: 12px;
        }

        .service-field {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .service-field input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 13px;
        }

        .service-field .remove-btn {
            background: #f56c6c;
            color: white;
            border: none;
            border-radius: 4px;
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .services-list {
            margin-top: 12px;
        }

        .service-item {
            background: #f5f7fa;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 8px;
        }

        .service-item p {
            margin-bottom: 4px;
            font-size: 14px;
        }

        .service-item label {
            color: #999;
            font-size: 12px;
        }

        .service-item a {
            color: #409eff;
            text-decoration: none;
        }

        .service-item a:hover {
            text-decoration: underline;
        }

        .service-actions {
            margin-top: 8px;
        }

        .parameter-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
            padding: 8px;
            background: #fafafa;
            border-radius: 4px;
        }
        .service-method,
        .api-url-input,
        .service-name,
        .parameter-row input,
        .parameter-row select {
            padding: 4px 8px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 12px;
        }

        .parameter-row .param-name {
            width: 100px;
        }

        .parameter-row .param-type {
            width: 80px;
        }

        .parameter-row .param-default {
            flex: 1;
        }

        .parameter-row .param-required {
            width: auto;
            margin: 0;
        }

        .parameter-label {
            font-size: 12px;
            color: #999;
            margin-right: 4px;
        }

        .service-section {
            border: 1px solid #e4e7ed;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            background: #fafafa;
        }

        .service-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #e4e7ed;
        }

        .service-section-title {
            font-weight: 600;
            color: #333;
        }

        .api-config {
            display: grid;
            grid-template-columns: 1fr 120px;
            gap: 8px;
            margin-bottom: 12px;
        }

        .api-url-input {
            grid-column: 1 / -1;
        }

        /* ============================================ */
        /* ============= 国风主题（默认） ============== */
        /* ============================================ */

        :root, [data-theme="chinese"] {
            --paper: #f5f1e8;
            --paper-dark: #ebe3cf;
            --paper-elev: #f0e9d6;
            --ink: #2c2c2c;
            --ink-soft: #4a4a4a;
            --ink-light: #888888;
            --rouge: #c94c4c;
            --rouge-deep: #a53838;
            --rouge-light: #e08a8a;
            --indigo: #2e4a62;
            --indigo-light: #4a6f8f;
            --gold: #b8923a;
            --gold-light: #d4b66b;
            --jade: #6b8e23;
            --border-classic: #c9bfa4;
            --shadow-soft: 0 2px 12px rgba(60, 40, 20, 0.08);
            --font-serif: "Source Han Serif SC", "Noto Serif SC", "SimSun", "STSong", serif;
            --font-kai: "KaiTi", "STKaiti", "楷体", "华文楷体", serif;
            --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', Menlo, monospace;
        }

        [data-theme="chinese"] body {
            font-family: var(--font-serif);
            color: var(--ink);
            background:
                radial-gradient(circle at 20% 10%, rgba(201, 76, 76, 0.04), transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(46, 74, 98, 0.05), transparent 45%),
                repeating-linear-gradient(45deg, rgba(184, 146, 58, 0.02) 0 2px, transparent 2px 16px),
                var(--paper);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.7;
        }

        [data-theme="chinese"] .container { max-width: 1200px; margin: 0 auto; }
        [data-theme="chinese"] .header { margin-bottom: 24px; gap: 16px; }
        [data-theme="chinese"] .header h1 {
            font-family: var(--font-kai);
            font-size: 28px;
            letter-spacing: 4px;
            color: var(--ink);
        }
        [data-theme="chinese"] .header h1::before {
            content: "❖ ";
            color: var(--rouge);
            margin-right: 4px;
        }

        [data-theme="chinese"] .theme-toggle {
            padding: 6px 16px;
            border: 1px solid var(--border-classic);
            background: var(--paper-elev);
            color: var(--ink);
            font-family: var(--font-kai);
            letter-spacing: 2px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all .2s;
        }
        [data-theme="chinese"] .theme-toggle:hover {
            border-color: var(--gold);
            box-shadow: 0 0 0 1px var(--gold-light);
        }

        [data-theme="chinese"] .filter-select {
            border: 1px solid var(--border-classic);
            border-radius: 6px;
            background: #fff;
            color: var(--ink);
            font-family: var(--font-serif);
        }
        [data-theme="chinese"] .filter-select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 182, 107, 0.15);
        }

        [data-theme="chinese"] .cat-tab {
            border: 1px solid var(--border-classic);
            background: var(--paper-elev);
            color: var(--ink);
            font-family: var(--font-kai);
            letter-spacing: 2px;
        }
        [data-theme="chinese"] .cat-tab:hover {
            border-color: var(--gold);
            box-shadow: 0 0 0 1px var(--gold-light);
        }
        [data-theme="chinese"] .cat-tab + .cat-tab { border-left: none; }
        [data-theme="chinese"] .cat-tab.active {
            background: linear-gradient(180deg, var(--rouge), var(--rouge-deep));
            color: #fff;
            border-color: var(--rouge-deep);
            box-shadow: 0 0 0 2px rgba(201, 76, 76, .2);
        }
        [data-theme="chinese"] .tool-cat {
            font-family: var(--font-kai);
            letter-spacing: 1px;
        }
        [data-theme="chinese"] .cat-work { background: rgba(46, 74, 98, .10); color: var(--indigo); border: 1px solid var(--indigo-light); }
        [data-theme="chinese"] .cat-life { background: rgba(201, 76, 76, .08); color: var(--rouge); border: 1px solid var(--rouge-light); }
        [data-theme="chinese"] .cat-general { background: rgba(107, 142, 35, .10); color: var(--jade); border: 1px solid var(--jade); }

        [data-theme="chinese"] .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 18px;
        }

        [data-theme="chinese"] .tool-card {
            background: var(--paper-elev);
            border: 1px solid var(--border-classic);
            border-radius: 10px;
            box-shadow: var(--shadow-soft);
            padding: 22px 20px 20px 28px;
            position: relative;
            transition: transform .25s, box-shadow .25s, border-color .2s;
            cursor: grab;
        }
        [data-theme="chinese"] .tool-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(60, 40, 20, .12);
        }
        [data-theme="chinese"] .tool-card.dragging { opacity: .35; cursor: grabbing; }
        [data-theme="chinese"] .tool-card.drag-over {
            border-color: var(--rouge);
            box-shadow: 0 0 0 2px var(--rouge-light);
        }
        [data-theme="chinese"] .tool-card::before {
            content: '';
            position: absolute; top: 8px; right: 8px;
            width: 14px; height: 14px;
            border-top: 1px solid var(--gold);
            border-right: 1px solid var(--gold);
        }
        [data-theme="chinese"] .tool-card::after {
            content: '';
            position: absolute; bottom: 8px; left: 8px;
            width: 14px; height: 14px;
            border-bottom: 1px solid var(--gold);
            border-left: 1px solid var(--gold);
        }
        [data-theme="chinese"] .drag-handle {
            position: absolute; top: 12px; left: 8px;
            color: var(--gold);
            font-size: 14px;
            opacity: .7;
            user-select: none;
            cursor: grab;
        }
        [data-theme="chinese"] .tool-header { margin-bottom: 14px; align-items: center; }
        [data-theme="chinese"] .tool-name {
            font-family: var(--font-kai);
            font-size: 20px;
            letter-spacing: 2px;
            color: var(--ink);
        }
        [data-theme="chinese"] .tool-type {
            background: rgba(184, 146, 58, 0.12);
            color: var(--gold);
            border: 1px solid var(--gold-light);
            border-radius: 4px;
            font-family: var(--font-kai);
            letter-spacing: 1px;
            padding: 2px 10px;
        }
        [data-theme="chinese"] .tool-info label { color: var(--ink-light); }
        [data-theme="chinese"] .tool-info p { color: var(--ink-soft); }

        [data-theme="chinese"] .status-running {
            background: rgba(107, 142, 35, 0.12);
            color: var(--jade);
            border: 1px solid var(--jade);
        }
        [data-theme="chinese"] .status-stopped {
            background: rgba(136, 136, 136, 0.10);
            color: var(--ink-light);
            border: 1px solid var(--border-classic);
        }
        [data-theme="chinese"] .status-healthy {
            background: rgba(107, 142, 35, 0.12);
            color: var(--jade);
            border: 1px solid var(--jade);
        }
        [data-theme="chinese"] .status-unhealthy {
            background: rgba(201, 76, 76, 0.10);
            color: var(--rouge);
            border: 1px solid var(--rouge-light);
        }

        [data-theme="chinese"] .btn {
            padding: 7px 16px;
            border-radius: 6px;
            background: #fff;
            border: 1px solid var(--border-classic);
            color: var(--ink);
            font-family: var(--font-serif);
            letter-spacing: 1px;
            transition: all .15s;
        }
        [data-theme="chinese"] .btn:hover {
            border-color: var(--gold);
            box-shadow: 0 0 0 1px var(--gold-light);
        }
        [data-theme="chinese"] .btn-primary {
            background: linear-gradient(180deg, var(--rouge), var(--rouge-deep));
            color: #fff;
            border: none;
            font-weight: 600;
            letter-spacing: 2px;
        }
        [data-theme="chinese"] .btn-primary:hover {
            filter: brightness(1.08);
            box-shadow: 0 0 0 2px rgba(201, 76, 76, .2);
        }
        [data-theme="chinese"] .btn-success {
            background: var(--jade);
            color: #fff;
            border: none;
            letter-spacing: 1.5px;
        }
        [data-theme="chinese"] .btn-warning {
            background: #d2691e;
            color: #fff;
            border: none;
        }
        [data-theme="chinese"] .btn-danger {
            background: #fff;
            color: var(--rouge);
            border-color: var(--rouge-light);
        }
        [data-theme="chinese"] .btn-danger:hover {
            border-color: var(--rouge);
            box-shadow: 0 0 0 1px var(--rouge-light);
        }

        [data-theme="chinese"] .modal-overlay {
            background: rgba(60, 40, 20, .45);
        }
        [data-theme="chinese"] .modal {
            background: var(--paper-elev);
            border: 2px double var(--border-classic);
            border-radius: 8px;
        }
        [data-theme="chinese"] .modal-header {
            border-bottom: 1px dashed var(--border-classic);
        }
        [data-theme="chinese"] .modal-header h2 {
            font-family: var(--font-kai);
            letter-spacing: 2px;
            color: var(--ink);
        }
        [data-theme="chinese"] .modal-footer {
            border-top: 1px dashed var(--border-classic);
        }
        [data-theme="chinese"] .form-group label { color: var(--ink); }
        [data-theme="chinese"] .form-group input,
        [data-theme="chinese"] .form-group select,
        [data-theme="chinese"] .service-field input,
        [data-theme="chinese"] .parameter-row input,
        [data-theme="chinese"] .parameter-row select,
        [data-theme="chinese"] .service-method,
        [data-theme="chinese"] .service-name,
        [data-theme="chinese"] .api-url-input {
            border: 1px solid var(--border-classic);
            border-radius: 6px;
            background: #fff;
            color: var(--ink);
            font-family: var(--font-serif);
        }
        [data-theme="chinese"] .form-group input:focus,
        [data-theme="chinese"] .form-group select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 182, 107, 0.15);
        }
        [data-theme="chinese"] .service-item {
            background: rgba(245, 241, 232, 0.6);
            border: 1px solid var(--border-classic);
        }
        [data-theme="chinese"] .service-section {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--border-classic);
        }
        [data-theme="chinese"] .parameter-row {
            background: rgba(245, 241, 232, 0.5);
        }
        [data-theme="chinese"] .service-item a,
        [data-theme="chinese"] .tool-info a {
            color: var(--indigo);
        }
        [data-theme="chinese"] .service-item a:hover,
        [data-theme="chinese"] .tool-info a:hover {
            color: var(--rouge);
        }

        /* ============================================ */
        /* ============= 现代主题（次选） ============== */
        /* ============================================ */

        [data-theme="modern"] .tool-card { cursor: grab; }
        [data-theme="modern"] .tool-card.dragging { opacity: .35; }
        [data-theme="modern"] .tool-card.drag-over {
            border-color: #409eff;
            box-shadow: 0 0 0 2px rgba(64, 158, 255, .25);
        }
        [data-theme="modern"] .theme-toggle {
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        [data-theme="modern"] .theme-toggle:hover { border-color: #409eff; color: #409eff; }
        [data-theme="modern"] .cat-tab:hover { border-color: #409eff; color: #409eff; }
        [data-theme="modern"] .cat-tab.active {
            background: #409eff;
            color: white;
            border-color: #409eff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>工具管理</h1>
                <div class="category-tabs" id="categoryTabs">
                    <button class="cat-tab" data-cat="work" onclick="setCategoryFilter('work')" title="工作">公</button>
                    <button class="cat-tab" data-cat="life" onclick="setCategoryFilter('life')" title="生活">私</button>
                    <button class="cat-tab" data-cat="general" onclick="setCategoryFilter('general')" title="通用">通</button>
                </div>
            </div>
            <div class="header-right">
                <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">❖ 国风</button>
                <select id="statusFilter" class="filter-select" onchange="filterTools()">
                    <option value="all">全部</option>
                    <option value="running">运行中</option>
                    <option value="stopped">已停止</option>
                </select>
                <button class="btn btn-primary" onclick="openModal()">+ 添加工具</button>
            </div>
        </div>
        
        <div id="toolGrid" class="tool-grid"></div>
        
        <div id="emptyState" class="empty-state" style="display: none;">
            <p>暂无工具，点击添加按钮开始</p>
        </div>
    </div>

    <div id="modal" class="modal-overlay">
        <div class="modal" style="width: 760px;">
            <div class="modal-header">
                <h2 id="modalTitle">添加工具</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="toolForm">
                    <input type="hidden" id="toolId">
                    <div class="form-row" style="grid-template-columns: 1.2fr 1fr 1fr;">
                        <div class="form-group">
                            <label>工具名称</label>
                            <input type="text" id="toolName" required placeholder="例如: My Server">
                        </div>
                        <div class="form-group">
                            <label>服务类型</label>
                            <select id="toolType" required>
                                <option value="npm">npm</option>
                                <option value="python">python</option>
                                <option value="node">node</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>分类</label>
                            <select id="toolCategory">
                                <option value="work">工作（公）</option>
                                <option value="life">生活（私）</option>
                                <option value="general" selected>通用（通）</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>运行目录</label>
                            <input type="text" id="toolWorkDir" required placeholder="例如: D:\project\myapp">
                        </div>
                        <div class="form-group">
                            <label>启动命令</label>
                            <input type="text" id="toolCommand" required placeholder="例如: npm run dev  或  java -jar app.jar ; taskkill /im java.exe">
                        </div>
                    </div>
                    <div class="form-group">
                        <small style="color: #888;">其他类型可用 ; 分隔，前面是启动命令，后面是停止命令</small>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>健康检查 URL（可选）</label>
                            <input type="text" id="toolHealthCheck" placeholder="例如: http://localhost:3000/health">
                        </div>
                        <div class="form-group">
                            <label>首页地址（可选）</label>
                            <input type="text" id="toolHomeUrl" placeholder="例如: http://localhost:3000">
                        </div>
                    </div>
                    <div class="form-row checkbox-row">
                        <div class="form-group">
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="checkbox" id="toolHidden" style="width: auto;">
                                隐藏（运行中工具接口将不显示此工具）
                            </label>
                        </div>
                        <div class="form-group">
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="checkbox" id="toolAutoStart" style="width: auto;">
                                自动启动（系统启动后自动启动此工具）
                            </label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveTool()">保存</button>
            </div>
        </div>
    </div>

    <div id="serviceModal" class="modal-overlay">
        <div class="modal" style="width: 700px;">
            <div class="modal-header">
                <h2>服务接口管理</h2>
                <button class="modal-close" onclick="closeServiceModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="serviceEditContainer"></div>
                <button type="button" class="btn btn-sm btn-primary" onclick="addServiceEditField()" style="margin-top: 8px;">+ 添加服务</button>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeServiceModal()">取消</button>
                <button class="btn btn-primary" onclick="saveServices()">保存</button>
            </div>
        </div>
    </div>

    <div id="serviceDescModal" class="modal-overlay">
        <div class="modal" style="width: 800px;">
            <div class="modal-header">
                <h2>编辑服务说明</h2>
                <button class="modal-close" onclick="closeServiceDescModal()">&times;</button>
            </div>
            <div class="modal-body">
                <textarea id="serviceDescEditor" style="width: 100%; height: 400px; padding: 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-family: monospace; font-size: 14px; resize: vertical;"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeServiceDescModal()">取消</button>
                <button class="btn btn-primary" onclick="saveServiceDesc()">确认</button>
            </div>
        </div>
    </div>

    <script>
        let tools = [];
        let currentToolId = null;
        let currentServiceIndex = null;
        let categoryFilter = 'all';

        const CATEGORY_LABEL = { work: '公', life: '私', general: '通' };

        function setCategoryFilter(cat) {
            categoryFilter = categoryFilter === cat ? 'all' : cat;
            renderCategoryTabs();
            renderTools();
        }

        function renderCategoryTabs() {
            document.querySelectorAll('#categoryTabs .cat-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.cat === categoryFilter);
            });
        }

        function filterTools() {
            renderTools();
        }

        async function loadTools() {
            try {
                const response = await fetch('/api/tools');
                tools = await response.json();
                renderTools();
            } catch (error) {
                console.error('加载工具失败:', error);
            }
        }

        function renderTools() {
            const grid = document.getElementById('toolGrid');
            const empty = document.getElementById('emptyState');
            const filter = document.getElementById('statusFilter').value;
            
            const filteredTools = tools.filter(tool => {
                if (categoryFilter !== 'all' && (tool.category || 'general') !== categoryFilter) return false;
                if (filter === 'all') return true;
                return tool.status === filter;
            });
            
            if (filteredTools.length === 0) {
                grid.style.display = 'none';
                if (tools.length === 0) {
                    empty.querySelector('p').textContent = '暂无工具，点击添加按钮开始';
                } else {
                    empty.querySelector('p').textContent = '没有符合条件的工具';
                }
                empty.style.display = 'block';
                return;
            }
            
            grid.style.display = 'grid';
            empty.style.display = 'none';
            
            grid.innerHTML = filteredTools.map(tool => `
                <div class="tool-card" draggable="true" data-id="${tool.id}"
                     ondragstart="onDragStart(event)" ondragover="onDragOver(event)"
                     ondragenter="onDragEnter(event)" ondragleave="onDragLeave(event)"
                     ondrop="onDrop(event)" ondragend="onDragEnd(event)">
                    <span class="drag-handle" title="拖动以排序">⠿</span>
                    <div class="tool-header">
                        <div>
                            <span class="tool-name">${tool.name}</span>
                            <span class="tool-type">${tool.type}</span>
                            <span class="tool-cat cat-${tool.category || 'general'}">${CATEGORY_LABEL[tool.category || 'general']}</span>
                        </div>
                        <span class="status-badge ${tool.status === 'running' ? 'status-running' : 'status-stopped'}">
                            ${tool.status === 'running' ? '运行中' : '已停止'}
                        </span>
                    </div>
                    <div class="tool-info">
                        <p><label>运行目录：</label>${tool.workDir}</p>
                        <p><label>启动命令：</label>${tool.command}</p>
                        ${tool.healthCheckUrl ? `
                            <p><label>健康检查：</label>${tool.healthCheckUrl}</p>
                            ${tool.health ? `
                                <span class="status-badge ${tool.health.status === 'healthy' ? 'status-healthy' : 'status-unhealthy'}">
                                    ${tool.health.status === 'healthy' ? '✓ 健康' : '✗ 异常'}
                                </span>
                                <span class="health-info">${tool.health.message}</span>
                            ` : ''}
                        ` : ''}
                        ${tool.homeUrl ? `
                            <p><label>首页地址：</label><a href="${tool.homeUrl}" target="_blank" style="color: #409eff;">${tool.homeUrl}</a></p>
                        ` : ''}
                    </div>
                    <div class="tool-actions">
                        ${tool.status === 'running' ? `
                            <button class="btn btn-warning btn-sm" onclick="restartTool('${tool.id}')">重启</button>
                            <button class="btn btn-danger btn-sm" onclick="stopTool('${tool.id}')">停止</button>
                        ` : `
                            <button class="btn btn-success btn-sm" onclick="startTool('${tool.id}')">启动</button>
                        `}
                        <button class="btn btn-sm" onclick="editTool('${tool.id}')">编辑</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteTool('${tool.id}')">删除</button>
                       
                            <button class="btn btn-primary btn-sm" onclick="toggleServices('${tool.id}')">服务</button>
                        
                    </div>
                </div>
            `).join('');
        }

        function openModal(tool = null) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const form = document.getElementById('toolForm');
            
            if (tool) {
                title.textContent = '编辑工具';
                document.getElementById('toolId').value = tool.id;
                document.getElementById('toolName').value = tool.name;
                document.getElementById('toolType').value = tool.type;
                document.getElementById('toolWorkDir').value = tool.workDir;
                document.getElementById('toolCommand').value = tool.command;
                document.getElementById('toolHealthCheck').value = tool.healthCheckUrl || '';
                document.getElementById('toolHomeUrl').value = tool.homeUrl || '';
                document.getElementById('toolCategory').value = tool.category || 'general';
                document.getElementById('toolHidden').checked = tool.hidden || false;
                document.getElementById('toolAutoStart').checked = tool.autoStart || false;
            } else {
                title.textContent = '添加工具';
                form.reset();
                document.getElementById('toolId').value = '';
                document.getElementById('toolHidden').checked = false;
                document.getElementById('toolAutoStart').checked = false;
            }
            
            modal.classList.add('active');
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;')
                       .replace(/</g, '&lt;')
                       .replace(/>/g, '&gt;')
                       .replace(/"/g, '&quot;')
                       .replace(/'/g, '&#039;')
                       .replace(/\n/g, '&#10;');
        }

        function unescapeHtml(text) {
            if (!text) return '';
            return text.replace(/&amp;/g, '&')
                       .replace(/&lt;/g, '<')
                       .replace(/&gt;/g, '>')
                       .replace(/&quot;/g, '"')
                       .replace(/&#039;/g, "'")
                       .replace(/&#10;/g, '\n');
        }

        function toggleServices(toolId) {
            currentToolId = toolId;
            const tool = tools.find(t => t.id === toolId);
            const container = document.getElementById('serviceEditContainer');
            container.innerHTML = (tool.services || []).map((s, i) => `
                <div class="service-section" data-index="${i}">
                    <div class="service-section-header">
                        <span class="service-section-title">服务 ${i + 1}</span>
                        <button type="button" class="remove-btn" onclick="removeServiceEditField(${i})">×</button>
                    </div>
                    <div class="api-config">
                        <input type="text" placeholder="服务名称" class="service-name" value="${escapeHtml(s.name || '')}">
                        <select class="service-method">
                            <option value="GET" ${(s.method || 'GET').toUpperCase() === 'GET' ? 'selected' : ''}>GET</option>
                            <option value="POST" ${(s.method || 'GET').toUpperCase() === 'POST' ? 'selected' : ''}>POST</option>
                        </select>
                        <input type="text" placeholder="API URL" class="service-api-url api-url-input" value="${escapeHtml(s.apiUrl || '')}">
                    </div>
                    <input type="hidden" class="service-desc" value="${escapeHtml(s.description || '')}">
                    <button type="button" class="btn btn-sm" onclick="editServiceDesc(${i})" style="margin-bottom: 8px;">编辑说明</button>
                    <div style="margin-bottom: 8px;">
                        <span class="parameter-label">参数：</span>
                        <button type="button" class="btn btn-sm" onclick="addParameter(${i})">+ 添加参数</button>
                    </div>
                    <div class="parameters-container" data-service-index="${i}">
                        ${(s.parameters || []).map((p, j) => `
                            <div class="parameter-row" data-param-index="${j}">
                                <input type="text" class="param-name" placeholder="参数名" value="${escapeHtml(p.name || '')}">
                                <select class="param-type">
                                    <option value="string" ${p.type === 'string' ? 'selected' : ''}>string</option>
                                    <option value="number" ${p.type === 'number' ? 'selected' : ''}>number</option>
                                    <option value="boolean" ${p.type === 'boolean' ? 'selected' : ''}>boolean</option>
                                    <option value="object" ${p.type === 'object' ? 'selected' : ''}>object</option>
                                </select>
                                <input type="text" class="param-default" placeholder="默认值" value="${escapeHtml(p.defaultValue || '')}">
                                <label><input type="checkbox" class="param-required" ${p.required ? 'checked' : ''}> 必须</label>
                                <button type="button" class="remove-btn" onclick="removeParameter(${i}, ${j})">×</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            document.getElementById('serviceModal').classList.add('active');
        }

        function addServiceEditField() {
            const container = document.getElementById('serviceEditContainer');
            const index = container.children.length;
            const div = document.createElement('div');
            div.className = 'service-section';
            div.dataset.index = index;
            div.innerHTML = `
                <div class="service-section-header">
                    <span class="service-section-title">服务 ${index + 1}</span>
                    <button type="button" class="remove-btn" onclick="removeServiceEditField(${index})">×</button>
                </div>
                <div class="api-config">
                    <input type="text" placeholder="服务名称" class="service-name" value="">
                    <select class="service-method">
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                    </select>
                    <input type="text" placeholder="API URL" class="service-api-url api-url-input" value="">
                </div>
                <input type="hidden" class="service-desc" value="">
                <button type="button" class="btn btn-sm" onclick="editServiceDesc(${index})" style="margin-bottom: 8px;">编辑说明</button>
                <div style="margin-bottom: 8px;">
                    <span class="parameter-label">参数：</span>
                    <button type="button" class="btn btn-sm" onclick="addParameter(${index})">+ 添加参数</button>
                </div>
                <div class="parameters-container" data-service-index="${index}"></div>
            `;
            container.appendChild(div);
        }

        function addParameter(serviceIndex) {
            const container = document.querySelector(`.parameters-container[data-service-index="${serviceIndex}"]`);
            const index = container.children.length;
            const div = document.createElement('div');
            div.className = 'parameter-row';
            div.dataset.paramIndex = index;
            div.innerHTML = `
                <input type="text" class="param-name" placeholder="参数名" value="">
                <select class="param-type">
                    <option value="string">string</option>
                    <option value="number">number</option>
                    <option value="boolean">boolean</option>
                    <option value="object">object</option>
                </select>
                <input type="text" class="param-default" placeholder="默认值" value="">
                <label><input type="checkbox" class="param-required"> 必须</label>
                <button type="button" class="remove-btn" onclick="removeParameter(${serviceIndex}, ${index})">×</button>
            `;
            container.appendChild(div);
        }

        function removeParameter(serviceIndex, paramIndex) {
            const container = document.querySelector(`.parameters-container[data-service-index="${serviceIndex}"]`);
            const rows = container.querySelectorAll('.parameter-row');
            if (rows[paramIndex]) {
                rows[paramIndex].remove();
            }
        }

        function editServiceDesc(index) {
            currentServiceIndex = index;
            const container = document.getElementById('serviceEditContainer');
            const fields = container.querySelectorAll('.service-field');
            const service = fields[index];
            let desc = '';
            if (service) {
                const descField = service.querySelector('.service-desc');
                desc = descField ? unescapeHtml(descField.value) : '';
            }
            document.getElementById('serviceDescEditor').value = desc;
            document.getElementById('serviceDescModal').classList.add('active');
        }

        function closeServiceDescModal() {
            document.getElementById('serviceDescModal').classList.remove('active');
            currentServiceIndex = null;
        }

        function saveServiceDesc() {
            if (currentServiceIndex === null) return;
            const container = document.getElementById('serviceEditContainer');
            const fields = container.querySelectorAll('.service-field');
            const desc = document.getElementById('serviceDescEditor').value;
            
            if (fields[currentServiceIndex]) {
                let descField = fields[currentServiceIndex].querySelector('.service-desc');
                if (!descField) {
                    descField = document.createElement('input');
                    descField.type = 'hidden';
                    descField.className = 'service-desc';
                    fields[currentServiceIndex].appendChild(descField);
                }
                descField.value = desc;
            }
            closeServiceDescModal();
        }

        function removeServiceEditField(index) {
            const container = document.getElementById('serviceEditContainer');
            const fields = container.querySelectorAll('.service-field');
            if (fields[index]) {
                fields[index].remove();
            }
        }

        function closeServiceModal() {
            document.getElementById('serviceModal').classList.remove('active');
            currentToolId = null;
        }

        async function saveServices() {
            if (!currentToolId) return;
            
            const container = document.getElementById('serviceEditContainer');
            const sections = container.querySelectorAll('.service-section');
            const services = [];
            sections.forEach(section => {
                const name = section.querySelector('.service-name').value.trim();
                const desc = section.querySelector('.service-desc') ? section.querySelector('.service-desc').value.trim() : '';
                const apiUrl = section.querySelector('.service-api-url').value.trim();
                const method = section.querySelector('.service-method').value;
                
                const paramsContainer = section.querySelector('.parameters-container');
                const paramRows = paramsContainer.querySelectorAll('.parameter-row');
                const parameters = [];
                paramRows.forEach(row => {
                    const paramName = row.querySelector('.param-name').value.trim();
                    if (paramName) {
                        parameters.push({
                            name: paramName,
                            type: row.querySelector('.param-type').value,
                            defaultValue: row.querySelector('.param-default').value.trim(),
                            required: row.querySelector('.param-required').checked
                        });
                    }
                });
                
                if (name) {
                    services.push({ name, description: desc, apiUrl, method, parameters });
                }
            });

            try {
                const response = await fetch(`/api/tools/${currentToolId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ services })
                });
                if (response.ok) {
                    closeServiceModal();
                    loadTools();
                }
            } catch (error) {
                console.error('保存服务失败:', error);
                alert('保存失败');
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        async function saveTool() {
            const id = document.getElementById('toolId').value;
            const toolData = {
                name: document.getElementById('toolName').value,
                type: document.getElementById('toolType').value,
                workDir: document.getElementById('toolWorkDir').value,
                command: document.getElementById('toolCommand').value,
                healthCheckUrl: document.getElementById('toolHealthCheck').value,
                homeUrl: document.getElementById('toolHomeUrl').value,
                category: document.getElementById('toolCategory').value,
                hidden: document.getElementById('toolHidden').checked,
                autoStart: document.getElementById('toolAutoStart').checked
            };

            if (!toolData.name || !toolData.workDir || !toolData.command) {
                alert('请填写所有必填字段');
                return;
            }

            try {
                const url = id ? `/api/tools/${id}` : '/api/tools';
                const method = id ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(toolData)
                });

                if (response.ok) {
                    closeModal();
                    loadTools();
                } else {
                    alert('保存失败');
                }
            } catch (error) {
                console.error('保存失败:', error);
                alert('保存失败');
            }
        }

        function editTool(id) {
            const tool = tools.find(t => t.id === id);
            if (tool) {
                openModal(tool);
            }
        }

        async function deleteTool(id) {
            if (!confirm('确定要删除这个工具吗？')) return;
            
            try {
                await fetch(`/api/tools/${id}`, { method: 'DELETE' });
                loadTools();
            } catch (error) {
                console.error('删除失败:', error);
                alert('删除失败');
            }
        }

        async function startTool(id) {
            try {
                const response = await fetch(`/api/tools/${id}/start`, { method: 'POST' });
                const result = await response.json();
                if (response.ok) {
                    loadTools();
                } else {
                    alert(result.error || '启动失败');
                }
            } catch (error) {
                console.error('启动失败:', error);
                alert('启动失败');
            }
        }

        async function stopTool(id) {
            try {
                const response = await fetch(`/api/tools/${id}/stop`, { method: 'POST' });
                const result = await response.json();
                if (response.ok) {
                    loadTools();
                } else {
                    alert(result.error || '停止失败');
                }
            } catch (error) {
                console.error('停止失败:', error);
                alert('停止失败');
            }
        }

        async function restartTool(id) {
            try {
                const response = await fetch(`/api/tools/${id}/restart`, { method: 'POST' });
                const result = await response.json();
                if (response.ok) {
                    loadTools();
                } else {
                    alert(result.error || '重启失败');
                }
            } catch (error) {
                console.error('重启失败:', error);
                alert('重启失败');
            }
        }

        setInterval(loadTools, 5000);

        loadTools();

        /* ============ 主题切换 ============ */
        function applyTheme(theme) {
            document.documentElement.dataset.theme = theme;
            const btn = document.querySelector('.theme-toggle');
            if (btn) {
                btn.textContent = theme === 'chinese' ? '❖ 国风' : '◇ 现代';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.dataset.theme || 'chinese';
            const next = current === 'chinese' ? 'modern' : 'chinese';
            applyTheme(next);
            try { localStorage.setItem('toolsWeb:theme', next); } catch (e) { /* localStorage 不可用时忽略 */ }
        }

        (function restoreTheme() {
            let saved = null;
            try { saved = localStorage.getItem('toolsWeb:theme'); } catch (e) {}
            if (saved === 'chinese' || saved === 'modern') {
                applyTheme(saved);
            }
        })();

        /* ============ 拖拽排序 ============ */
        let dragSourceId = null;

        function onDragStart(e) {
            const card = e.currentTarget;
            dragSourceId = card.dataset.id;
            card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            try { e.dataTransfer.setData('text/plain', dragSourceId); } catch (err) { /* 部分浏览器异常 */ }
        }

        function onDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function onDragEnter(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function onDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function onDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const targetId = e.currentTarget.dataset.id;
            if (!dragSourceId || dragSourceId === targetId) return;
            const fromIdx = tools.findIndex(t => t.id === dragSourceId);
            const toIdx   = tools.findIndex(t => t.id === targetId);
            if (fromIdx < 0 || toIdx < 0) return;
            const [moved] = tools.splice(fromIdx, 1);
            tools.splice(toIdx, 0, moved);
            renderTools();
            persistOrder();
        }

        function onDragEnd(e) {
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.tool-card.drag-over').forEach(el => el.classList.remove('drag-over'));
            dragSourceId = null;
        }

        async function persistOrder() {
            try {
                await fetch('/api/tools/reorder', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order: tools.map(t => t.id) })
                });
            } catch (err) {
                console.error('保存顺序失败', err);
            }
        }
    </script>
</body>
</html>
